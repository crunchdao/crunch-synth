name: Notebooks
on: push

jobs:
  list:
    runs-on: ubuntu-latest

    outputs:
      notebooks: ${{ steps.list.outputs.notebooks }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: List notebooks
        id: list
        working-directory: crunch_synth/examples
        run: echo "notebooks=$(ls *.ipynb | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  run:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        notebook: ${{ fromJSON(needs.list.outputs.notebooks) }}

    name: ${{ matrix.notebook }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel

      - name: Build
        run: make build

      - name: Install wheel
        run: pip install $(echo dist/*.whl) nbconvert ipykernel lightgbm scikit-learn

      - name: Run notebook
        working-directory: crunch_synth/examples
        run: >
          jupyter nbconvert --to notebook --execute ${{ matrix.notebook }}
          --output-dir ${{ runner.temp }} --ExecutePreprocessor.timeout=1200
